id: com.ictrek.ziziyi-office
name:
  zh-CN: ZIZIYI Office
  en: ZIZIYI Office
description:
  zh-CN: 本地优先的浏览器 Office 套件，直接在浏览器中查看和编辑 Word、Excel、PPT 文档，文件全程留在本机。
  en: Local-first browser office suite for viewing and editing Word, Excel and PowerPoint documents entirely in the browser.
version: __APP_VERSION__
author: ictrek
category: [office]
arch: [amd64, arm64]
icon: icon.png

frontend:
  enabled: true
  basePath: /app/com.ictrek.ziziyi-office

platform:
  version: ">=3.0.0"

profiles:
  - name: amd
    title:
      zh-CN: AMD64
      en: AMD64
    description:
      zh-CN: x86_64 / AMD64 平台，使用 AMD_with_cuda 发布表中的 ziziyi-office 镜像。
      en: x86_64 / AMD64 platform, using the ziziyi-office image from the AMD_with_cuda sheet.
    conflicts: [arm]
  - name: arm
    title:
      zh-CN: ARM64
      en: ARM64
    description:
      zh-CN: ARM64 平台，使用 ARM_with_cuda 发布表中的 ziziyi-office 镜像。
      en: ARM64 platform, using the ziziyi-office image from the ARM_with_cuda sheet.
    conflicts: [amd]
