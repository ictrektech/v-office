# =============================================================================
# V-Office — 声明式配置定义
# =============================================================================
# 前端为纯静态应用；文档由配套存储服务写入 VOS 应用私有存储。
# =============================================================================

configs:
  - name: VOS_OIDC_USERINFO_URL
    type: string
    title:
      zh-CN: VOS OIDC UserInfo 地址
      en: VOS OIDC UserInfo URL
    description:
      zh-CN: 存储服务校验 VOS OIDC Fastpath 令牌使用的 /v1000/oauth2/userinfo 地址，默认适配 VOS backend 使用 host 网络 `SITE_PORT=8105` 的部署，一般无需修改。
      en: /v1000/oauth2/userinfo endpoint used by the storage service to verify VOS OIDC Fastpath tokens. The default matches a VOS backend on the host network with `SITE_PORT=8105`; usually no change is needed.
    default: http://172.17.0.1:8105/v1000/oauth2/userinfo

  - name: V_OFFICE_WOPI_SECRET
    type: string
    title:
      zh-CN: WOPI 令牌签名密钥
      en: WOPI token signing secret
    description:
      zh-CN: 存储服务为 Collabora 签发 WOPI access_token 时使用的 HMAC 密钥，只在本服务内校验，Collabora 只回传不解析。留空则存储服务每次启动随机生成一个，各套部署天然互不相同；写死成公共值等于所有服务器共用同一密钥，生产建议填入一段随机字符串（固定值还能让重启不影响在途编辑会话）。
      en: HMAC secret the storage service uses to sign WOPI access_tokens for Collabora. It is verified only inside this service (Collabora just echoes the token). Leave empty and the storage service generates a random one per start, so every deployment differs; a hard-coded shared value would let one deployment forge another's tokens. Set a random value for production (a fixed value also keeps in-flight editing sessions valid across restarts).
    default: ""
