<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    为什么需要这个文件（2026-10-13 本地实测定案）：

    Collabora 基础镜像里 /etc/fonts/fonts.conf 只扫描
      /usr/share/fonts、/usr/local/share/fonts、~/.fonts
    而**这三个目录在镜像里全都不存在**。

    偏偏 LibreOffice 自带的中文字体是放在
      /opt/collaboraoffice/share/fonts/truetype/NotoSerifSC-*.otf（约 11MB）
      /opt/collaboraoffice/share/fonts/truetype/NotoSansSC-*.otf（约 8.4MB）
    —— fontconfig 看不到它们。结果：文档里请求「宋体」的正文只能落到
    DejaVu Serif 这类**纯拉丁字形**的替身上，中文字形一个都画不出来，
    导出 PDF / 屏幕渲染表现为「正文全白、只剩数字与标点」；
    标题因为请求的是「黑体」、恰好命中 Noto Sans（含中文）才勉强可见。

    第一段 <dir> 把 LO 的字体目录纳入扫描；后面的 alias 把 Word 文档里
    常见的宋体/黑体一族，显式映射到那两套确实存在的中文单文件字体。
    注意用 <prefer>（追加偏好）而**不要**用 <match>+mode="assign"：
    assign+strong 会把字体名整个换掉，一旦目标名解析不到（例如指向只存在于
    .ttc 集合里的 family）就会连标题一起变成一片空白——实测踩过。

    另一个踩过的坑：不要往容器里塞 Noto CJK 的 **.ttc 集合**文件。
    LibreOffice 对 .ttc 的 face 索引不可靠，会出现「拉丁字形正常、中文字形
    全无」的假象，比缺字体更难查。要用就用单文件 .otf/.ttf。

    ─────────────────────────────────────────────────────────────
    2026-10-15 补充：偏好列表里必须带上 KR / JP（实测踩过）

    `Noto Serif SC` 是**简体中文子集**，只有汉字字形——韩文、日文假名一个
    都没有。原先只映射到 SC，于是「中文段落里把一句话改成韩语」时，新文字
    继承了段落的「宋体」，宋体解析到 SC，韩文没有字形可画，**整片变成方框 □**
    （2026-10-15 实测：AI 把中文改成韩语，文档里出现一串 □）。

    修法：<prefer> 后面接上 KR / JP——fontconfig 的偏好是**有序回退**，
    SC 画不出的字形会自动落到 KR / JP 上；中日韩混排因此都有字形。
    镜像里这三套都是单文件 .otf，都可用。
  -->
  <dir>/opt/collaboraoffice/share/fonts/truetype</dir>

  <alias><family>宋体</family><prefer>
    <family>Noto Serif SC</family>
    <family>Noto Serif KR</family>
    <family>Noto Serif JP</family>
  </prefer></alias>
  <alias><family>SimSun</family><prefer>
    <family>Noto Serif SC</family>
    <family>Noto Serif KR</family>
    <family>Noto Serif JP</family>
  </prefer></alias>
  <alias><family>新宋体</family><prefer>
    <family>Noto Serif SC</family>
    <family>Noto Serif KR</family>
    <family>Noto Serif JP</family>
  </prefer></alias>
  <alias><family>楷体</family><prefer>
    <family>Noto Serif SC</family>
    <family>Noto Serif KR</family>
    <family>Noto Serif JP</family>
  </prefer></alias>
  <alias><family>仿宋</family><prefer>
    <family>Noto Serif SC</family>
    <family>Noto Serif KR</family>
    <family>Noto Serif JP</family>
  </prefer></alias>

  <alias><family>黑体</family><prefer>
    <family>Noto Sans SC</family>
    <family>Noto Sans KR</family>
    <family>Noto Sans JP</family>
  </prefer></alias>
  <alias><family>SimHei</family><prefer>
    <family>Noto Sans SC</family>
    <family>Noto Sans KR</family>
    <family>Noto Sans JP</family>
  </prefer></alias>
  <alias><family>微软雅黑</family><prefer>
    <family>Noto Sans SC</family>
    <family>Noto Sans KR</family>
    <family>Noto Sans JP</family>
  </prefer></alias>
  <alias><family>Microsoft YaHei</family><prefer>
    <family>Noto Sans SC</family>
    <family>Noto Sans KR</family>
    <family>Noto Sans JP</family>
  </prefer></alias>

  <!-- 兜底：声明中文的文本，候选表末尾补上中日韩三种无衬线字体，
       保证「中文段落里突然出现韩文/日文」也一定有字形可画。
       （只补 SC 时韩文就是方框——实测踩过，见上面 2026-10-15 那段。） -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans SC</string>
      <string>Noto Sans KR</string>
      <string>Noto Sans JP</string>
    </edit>
  </match>
</fontconfig>
