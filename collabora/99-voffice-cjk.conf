<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    为什么需要这个文件（2026-10-13 本地实测定案）：

    Collabora 基础镜像里 /etc/fonts/fonts.conf 只扫描
      /usr/share/fonts、/usr/local/share/fonts、~/.fonts
    而**这三个目录在镜像里全都不存在**。

    偏偏 LibreOffice 自带的中文字体是放在
      /opt/collaboraoffice/share/fonts/truetype/NotoSerifSC-*.otf（约 11MB）
      /opt/collaboraoffice/share/fonts/truetype/NotoSansSC-*.otf（约 8.4MB）
    —— fontconfig 看不到它们。结果：文档里请求「宋体」的正文只能落到
    DejaVu Serif 这类**纯拉丁字形**的替身上，中文字形一个都画不出来，
    导出 PDF / 屏幕渲染表现为「正文全白、只剩数字与标点」；
    标题因为请求的是「黑体」、恰好命中 Noto Sans（含中文）才勉强可见。

    第一段 <dir> 把 LO 的字体目录纳入扫描；后面的 alias 把 Word 文档里
    常见的宋体/黑体一族，显式映射到那两套确实存在的中文单文件字体。
    注意用 <prefer>（追加偏好）而**不要**用 <match>+mode="assign"：
    assign+strong 会把字体名整个换掉，一旦目标名解析不到（例如指向只存在于
    .ttc 集合里的 family）就会连标题一起变成一片空白——实测踩过。

    另一个踩过的坑：不要往容器里塞 Noto CJK 的 **.ttc 集合**文件。
    LibreOffice 对 .ttc 的 face 索引不可靠，会出现「拉丁字形正常、中文字形
    全无」的假象，比缺字体更难查。要用就用单文件 .otf/.ttf。
  -->
  <dir>/opt/collaboraoffice/share/fonts/truetype</dir>

  <alias><family>宋体</family><prefer><family>Noto Serif SC</family></prefer></alias>
  <alias><family>SimSun</family><prefer><family>Noto Serif SC</family></prefer></alias>
  <alias><family>新宋体</family><prefer><family>Noto Serif SC</family></prefer></alias>
  <alias><family>楷体</family><prefer><family>Noto Serif SC</family></prefer></alias>
  <alias><family>仿宋</family><prefer><family>Noto Serif SC</family></prefer></alias>

  <alias><family>黑体</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias><family>SimHei</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias><family>微软雅黑</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias><family>Microsoft YaHei</family><prefer><family>Noto Sans SC</family></prefer></alias>

  <!-- 兜底：任何中文文本，候选表末尾补上中文无衬线字体，保证一定有字形可画 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans SC</string></edit>
  </match>
</fontconfig>
