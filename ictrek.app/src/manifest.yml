id: com.ictrek.v-office
name:
  zh-CN: V-Office
  en: V-Office
description:
  zh-CN: 本地优先的浏览器 Office 套件，在浏览器中查看和编辑 Word、Excel、PPT 文档；VOS 部署下使用应用私有存储并按用户隔离，自动完成 VOS OIDC 免登录。
  en: Local-first browser office suite for viewing and editing Word, Excel and PowerPoint documents; on VOS, it uses private app storage with per-user isolation and automatic VOS OIDC sign-in.
version: __APP_VERSION__
author: ictrek
category: [office]
arch: [amd64, arm64]
icon: icon.png

frontend:
  enabled: true
  basePath: /app/com.ictrek.v-office

platform:
  version: ">=3.0.0"

storage:
  directories:
    - path: documents
      mode: "0755"

# OAuth2 public client declaration for VOS OIDC Fastpath.
# VOS 1.1+ injects `window.vos_platform.api.v1000.oauth2` into same-origin
# iframes; the frontend runs PKCE (authorization_code + S256) silently and
# hands the access token to the storage service, which verifies it against
# VOS `/v1000/oauth2/userinfo`. No redirect jumps. Mirrors agent-room /
# WeKnora / agentic-search manifests. The redirect URI is a fixed sentinel
# and does not need to be reachable.
oauth2:
  client:
    id: com.ictrek.v-office
    redirect_uris:
      - https://app.vos-platform.internal/callback
    grant_types:
      - authorization_code
      - refresh_token
    response_types:
      - code
    scopes:
      - openid
      - profile
      - email
    pkce_required: true
    token_endpoint_auth_method: none
    access_token_ttl: 3600
    refresh_token_ttl: 1209600

profiles:
  - name: amd
    title:
      zh-CN: AMD64
      en: AMD64
    description:
      zh-CN: x86_64 / AMD64 平台，使用 AMD_with_cuda 发布表中的 v-office 镜像。
      en: x86_64 / AMD64 platform, using the v-office images from the AMD_with_cuda sheet.
    conflicts: [arm]
  - name: arm
    title:
      zh-CN: ARM64
      en: ARM64
    description:
      zh-CN: ARM64 平台，使用 ARM_with_cuda 发布表中的 v-office 镜像。
      en: ARM64 platform, using the v-office images from the ARM_with_cuda sheet.
    conflicts: [amd]
