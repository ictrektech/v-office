# =============================================================================
# V-Office — VOS 应用 Docker Compose
# =============================================================================
# 两个服务，安装时由 VOS 按 profile（amd / arm）各选其一：
#   - v-office-web:     纯静态前端（Next.js 静态导出 + OnlyOffice 前端
#                            资源），Caddy 在容器内 80 端口提供静态服务。
#   - v-office-storage: 文档存储服务（FastAPI），校验 VOS OIDC
#                            Fastpath 令牌后直接读写 VOS 自动分配的
#                            VOS_APP_STORAGE_PATH/documents 私有目录。
# 镜像从华为云 SWR 拉取（pull 模式），标签由 package.sh 从飞书发布表读取
# 并写入 .env。前端无状态；所有文档落在应用私有存储中。
# =============================================================================

x-v-office-web-base: &v-office-web-base
  restart: unless-stopped
  pull_policy: always
  environment:
    VOS_APP_VERSION: "__APP_VERSION__"
  networks:
    vos_default:
      aliases:
        - v-office
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-top-open.rule=PathPrefix(`/app/com.ictrek.v-office`) && HeadersRegexp(`Sec-Fetch-Dest`, `document`)"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-top-open.priority=1000"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-top-open.service=${COMPOSE_PROJECT_NAME:-v-office}-web"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-top-open.middlewares=${COMPOSE_PROJECT_NAME:-v-office}-top-open-redirect"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-v-office}-top-open-redirect.redirectregex.regex=^(https?://[^/]+)/app/com\\.ictrek\\.v-office/?(?:\\?.*)?$"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-v-office}-top-open-redirect.redirectregex.replacement=$${1}/#/app/com.ictrek.v-office/com-ictrek-v-office/v-office"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-v-office}-top-open-redirect.redirectregex.permanent=false"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-web.rule=PathPrefix(`/app/com.ictrek.v-office`)"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-web.service=${COMPOSE_PROJECT_NAME:-v-office}-web"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-web.middlewares=${COMPOSE_PROJECT_NAME:-v-office}-web-slash,${COMPOSE_PROJECT_NAME:-v-office}-web-strip"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-v-office}-web-slash.redirectregex.regex=^(.*)/app/com\\.ictrek\\.v-office$"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-v-office}-web-slash.redirectregex.replacement=$${1}/app/com.ictrek.v-office/"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-v-office}-web-slash.redirectregex.permanent=true"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-v-office}-web-strip.stripprefix.prefixes=/app/com.ictrek.v-office"
    - "traefik.http.services.${COMPOSE_PROJECT_NAME:-v-office}-web.loadbalancer.server.port=80"
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
    interval: 30s
    timeout: 10s
    start_period: 15s
    retries: 3

x-v-office-storage-base: &v-office-storage-base
  restart: unless-stopped
  pull_policy: always
  networks:
    vos_default:
      aliases:
        - v-office-storage
  environment:
    DATA_ROOT: /data
    VOS_APP_VERSION: "__APP_VERSION__"
    VOS_OIDC_USERINFO_URL: ${VOS_OIDC_USERINFO_URL:-http://172.17.0.1:8105/v1000/oauth2/userinfo}
  volumes:
    - ${VOS_APP_STORAGE_PATH}/documents:/data
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-api.rule=PathPrefix(`/api/com.ictrek.v-office`)"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-api.service=${COMPOSE_PROJECT_NAME:-v-office}-api"
    - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-v-office}-api.middlewares=${COMPOSE_PROJECT_NAME:-v-office}-api-strip"
    - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-v-office}-api-strip.stripprefix.prefixes=/api/com.ictrek.v-office"
    - "traefik.http.services.${COMPOSE_PROJECT_NAME:-v-office}-api.loadbalancer.server.port=5000"
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)\""]
    interval: 30s
    timeout: 10s
    start_period: 15s
    retries: 3

services:
  v-office-web-amd:
    <<: *v-office-web-base
    profiles: ["amd"]
    image: ${V_OFFICE_AMD_IMAGE}

  v-office-storage-amd:
    <<: *v-office-storage-base
    profiles: ["amd"]
    image: ${V_OFFICE_STORAGE_AMD_IMAGE}

  v-office-web-arm:
    <<: *v-office-web-base
    profiles: ["arm"]
    image: ${V_OFFICE_ARM_IMAGE}

  v-office-storage-arm:
    <<: *v-office-storage-base
    profiles: ["arm"]
    image: ${V_OFFICE_STORAGE_ARM_IMAGE}

networks:
  vos_default:
    external: true
