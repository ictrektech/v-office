# =============================================================================
# V-Office — 前端导航路由
# 平铺 page：与其他应用（HybRAG/Model-Hub）一致的门户导航形态
# =============================================================================

routers:
  - id: v-office
    kind: page
    title:
      # 品牌名不翻译：与 manifest.yml 的应用名、页面标题保持一致
      # （同平台的 Model-Hub 也是两种语言都写 Model-Hub）
      zh-CN: V-Office
      en: V-Office
    icon: lucide:file-text
    order: 200
    iframe-src: /app/com.ictrek.v-office/?v=__APP_VERSION__
    keep-alive: true
    entry-point: true
    embed: true
